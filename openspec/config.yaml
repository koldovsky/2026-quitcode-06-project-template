schema: spec-driven

# Контекст і правила потрапляють у кожен запит агента (`openspec instructions <artifact> --json`).
# Тримайте їх короткими: довгі інструкції агент виконує гірше.
# УВАГА: кожен пункт rules — у лапках. Пункт із ": " без лапок YAML читає як словник,
# і OpenSpec мовчки (лише з попередженням) відкидає ВСІ правила цього артефакту.
context: |
  Language: Ukrainian
  All artifacts must be written in Ukrainian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Продукт: див. product/vision.md, терміни — product/glossary.md, ролі — product/roles.md (копія з репо вимог PM).
  Стек (фіксований, у специфікаціях його не описуємо): Next.js 16 App Router, React 19, TypeScript, Tailwind 4, Supabase (Postgres + Auth + RLS), Vercel, Node 24.
  Конвенції: одна зміна OpenSpec — один намір; AC ID формату AC-<AREA>-<NN> на початку назви кожного сценарію; ті самі ID — у назвах тестів і в docs/conformance.md; дані в прикладах лише синтетичні (*@example.test).
  Ролі: вимоги (product/ і openspec/specs/) веде PM у своєму репо вимог; у це репо (власна реалізація розробника) їх копіює лише команда агента /spec-sync — тут їх не редагуємо. Розробник пише тут лише власні зміни impl-<зріз> (skip_specs: true): design.md і tasks.md (як реалізувати); питання й пропозиції до вимог — issue в репо PM.

rules:
  proposal:
    - "У цьому репо зміни пише розробник, і це лише impl-<зріз> зі skip_specs: true у .openspec.yaml: proposal.md короткий — ## Why (який зріз вимог реалізуємо) і ## What Changes (які AC з openspec/specs/ покриває зміна, списком AC ID)."
    - "Не згадуйте нових вимог чи AC, яких немає в openspec/specs/: вимоги змінює лише PM у своєму репо, а сюди їх приносить /spec-sync."
  specs:
    - "Специфікацій (specs/) у змінах цього репо не створюйте: openspec/specs/ — копія вимог PM, і змінює її лише /spec-sync."
    - "Формат вимог PM (для читання): кожна вимога — одне речення EARS з англійським SHALL або MUST; сценарій — один AC, назва починається з AC ID формату AC-<AREA>-<NN>, заголовок — рівно чотири решітки (####), кроки - **WHEN** / - **THEN** / - **AND**."
  design:
    - "Design пише розробник: таблиці, міграції (GRANT + RLS + політики), server actions, сторінки; кожне рішення посилається на AC ID."
  tasks:
    - "Задачі — вертикальні зрізи (UI + server action + таблиця/RLS + тест); кожна закінчується рядком 'Done when: AC-…'."
